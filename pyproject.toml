[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "renderlabel"
version = "0.1.0"
description = "Saturation-aware view selection for render-based keypoint label propagation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "opencv-python>=4.6",
    "pillow>=9.0",
]

[project.optional-dependencies]
subset = ["pycolmap>=0.6"]

[project.scripts]
renderlabel = "renderlabel.cli:main"

[tool.setuptools]
packages = ["renderlabel"]
